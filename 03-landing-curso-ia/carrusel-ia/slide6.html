<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Slide 6 - La Regla de Oro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1350px;
      background: radial-gradient(circle at 50% 30%, rgba(59, 130, 246, 0.25) 0%, transparent 60%),
                  radial-gradient(circle at 15% 85%, rgba(37, 99, 235, 0.15) 0%, transparent 50%),
                  #0B1120;
      color: #F8FAFC;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 90px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #60A5FA;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .counter {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #64748B;
      letter-spacing: 2px;
    }
    .quote-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto 0;
    }
    .quote-mark {
      font-family: 'Outfit', sans-serif;
      font-size: 160px;
      line-height: 0.6;
      color: rgba(59, 130, 246, 0.35);
      margin-bottom: 20px;
    }
    .quote-title {
      font-family: 'Outfit', sans-serif;
      font-size: 58px;
      font-weight: 800;
      line-height: 1.15;
      color: #94A3B8;
      margin-bottom: 16px;
    }
    .quote-highlight {
      font-family: 'Outfit', sans-serif;
      font-size: 64px;
      font-weight: 900;
      line-height: 1.15;
      background: linear-gradient(135deg, #60A5FA 0%, #38BDF8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 40px;
    }
    .quote-sub {
      font-size: 26px;
      color: #CBD5E1;
      line-height: 1.5;
      max-width: 820px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 30px 40px;
      border-radius: 24px;
    }
    .quote-sub strong {
      color: #F8FAFC;
    }
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 30px;
    }
    .author {
      font-size: 22px;
      font-weight: 600;
      color: #64748B;
    }
    .swipe-cta {
      font-size: 22px;
      font-weight: 700;
      color: #60A5FA;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="badge">Punto Clave</div>
    <div class="counter">06 / 07</div>
  </div>

  <div class="quote-container">
    <div class="quote-mark">“</div>
    <div class="quote-title">La IA no sustituye empleos.</div>
    <div class="quote-highlight">Sustituye a quienes no saben usarla como palanca de ingresos.</div>
    <div class="quote-sub">
      La ventaja competitiva ya no es saber hacer preguntas en un chat, sino <strong>empaquetar soluciones que generen dinero</strong> para ti o tus clientes.
    </div>
  </div>

  <div class="footer-bar">
    <div class="author">CURSO IA • GUÍA PRÁCTICA</div>
    <div class="swipe-cta">Último paso 👉</div>
  </div>
</body>
</html>
